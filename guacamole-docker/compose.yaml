services:
  guacd:
    container_name: guacd
    image: guacamole/guacd
    restart: unless-stopped
    networks:
      guac-net:
        ipv4_address:

  guacweb:
    container_name: guac_web
    image: guacamole/guacamole
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      MYSQL_DATABASE: guacamole_db
      MYSQL_HOSTNAME: 
      MYSQL_PASSWORD: pass
      MYSQL_USER: guacamole_user
      GUACD_HOSTNAME:
    depends_on:
      - guacamole-sql
      - guacd
    networks:
      guac-net:

  guacamole-sql:
    container_name: guac-sql
    image: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: pass
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      guac-net:
        ipv4_address:

volumes:
  dbdata:

networks:
  guac-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 
